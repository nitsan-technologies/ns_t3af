<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:variable name="ll" value="LLL:EXT:ns_t3af/Resources/Private/Language/locallang_be.xlf" />

<div class="nst3af-agent-root" data-nst3af-agent-root hidden>
    <div class="nst3af-agent-backdrop" data-nst3af-agent-backdrop hidden></div>

    <div class="nst3af-agent-panel"
         id="nst3af-agent-dialog"
         role="dialog"
         aria-modal="true"
         aria-labelledby="nst3af-agent-dialog-title"
         aria-describedby="nst3af-agent-dialog-desc"
         aria-hidden="true"
         hidden
         data-nst3af-agent-panel>
        <header class="nst3af-agent-header">
            <div class="nst3af-agent-header__row">
                <span class="nst3af-agent-header__mark" aria-hidden="true">&#10022;</span>
                <div>
                    <h2 class="nst3af-agent-header__title" id="nst3af-agent-dialog-title">
                        <f:translate key="{ll}:agent.modal.title" default="AI Agent" />
                    </h2>
                    <p class="nst3af-agent-header__subtitle" id="nst3af-agent-dialog-desc">
                        <f:translate key="{ll}:agent.modal.subtitle" default="Ask for anything on this screen. It drafts, you approve, inside the conversation." />
                    </p>
                </div>
                <a class="btn btn-default btn-sm nst3af-agent-header__settings"
                   href="#"
                   data-nst3af-agent-settings
                   data-nst3af-agent-settings-label="{f:translate(key: '{ll}:agent.modal.settings', default: 'Settings')}">
                    <f:translate key="{ll}:agent.modal.settings" default="Settings" />
                </a>
                <button type="button"
                        class="btn btn-link nst3af-agent-header__close"
                        data-nst3af-agent-close
                        aria-label="{f:translate(key: '{ll}:agent.modal.close', default: 'Close dialog')}">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
        </header>

        <div class="nst3af-agent-context" data-nst3af-agent-context aria-live="off"></div>

        <div class="nst3af-agent-disclosure" data-nst3af-agent-disclosure hidden>
            <f:translate key="{ll}:agent.disclosure" default="This assistant can use AI. Responses may be inaccurate. Review suggestions before applying changes." />
            <button type="button" class="nst3af-agent-disclosure__dismiss" data-nst3af-agent-disclosure-dismiss>
                <f:translate key="{ll}:agent.disclosure.gotIt" default="Got it" />
            </button>
        </div>

        <div class="nst3af-agent-stream"
             data-nst3af-agent-stream
             role="log"
             aria-live="polite"
             aria-relevant="additions text"></div>

        <footer class="nst3af-agent-footer">
            <div class="nst3af-agent-composer nst3af-agent-composer--agbox" data-nst3af-agent-composer>
                <label class="visually-hidden" for="nst3af-agent-input">
                    <f:translate key="{ll}:agent.composer.label" default="Message" />
                </label>
                <textarea id="nst3af-agent-input"
                          class="nst3af-agent-composer__input"
                          data-nst3af-agent-input
                          rows="2"
                          placeholder="{f:translate(key: '{ll}:agent.composer.placeholder', default: 'Ask a question, / for tools, @ for records…')}"></textarea>
                <div class="nst3af-agent-composer__bar">
                    <div class="nst3af-agent-composer__attach-wrap">
                        <button type="button"
                                class="btn btn-default btn-sm nst3af-agent-composer__attach"
                                data-nst3af-agent-attach-toggle
                                aria-expanded="false"
                                aria-haspopup="menu"
                                aria-label="{f:translate(key: '{ll}:agent.attach.open', default: 'Attach')}">
                            <span aria-hidden="true">+</span>
                        </button>
                        <div class="nst3af-agent-attach-menu" data-nst3af-agent-attach-menu hidden role="menu">
                            <button type="button"
                                    class="nst3af-agent-attach-menu__item"
                                    data-nst3af-agent-attach-files
                                    role="menuitem">
                                <f:translate key="{ll}:agent.attach.files" default="Add files or photos" />
                            </button>
                        </div>
                        <input type="file"
                               class="visually-hidden"
                               data-nst3af-agent-file-input
                               multiple
                               accept="image/*,.pdf,.txt,.md,.doc,.docx" />
                    </div>
                    <span class="nst3af-agent-composer__hint">
                        <f:translate key="{ll}:agent.composer.hint" default="/ tools · @ records ·" />
                        <kbd class="nst3af-agent-kbd" data-nst3af-agent-hotkey-kbd>Ctrl/Cmd+Shift+K</kbd>
                    </span>
                    <button type="button"
                            class="btn btn-primary nst3af-agent-composer__send"
                            data-nst3af-agent-send
                            aria-label="{f:translate(key: '{ll}:agent.composer.send', default: 'Send message')}">
                        <span aria-hidden="true">&#8593;</span>
                    </button>
                </div>
                <div class="nst3af-agent-autocomplete" data-nst3af-agent-autocomplete hidden role="listbox" aria-label="{f:translate(key: '{ll}:agent.autocomplete.label', default: 'Suggestions')}"></div>
            </div>
        </footer>
    </div>
</div>
</html>
