<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">

<f:variable name="badgeClass" value="badge-secondary" />
<f:if condition="{state} == shown"><f:variable name="badgeClass" value="badge-success" /></f:if>
<f:if condition="{state} == held"><f:variable name="badgeClass" value="badge-warning" /></f:if>

<span class="badge {badgeClass}">{state -> f:format.case(mode: 'capital')}</span>
