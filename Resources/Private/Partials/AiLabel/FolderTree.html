<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:variable name="ll" value="LLL:EXT:ns_t3af/Resources/Private/Language/locallang_mod_dashboard.xlf" />

<aside class="aiu-mcp-tools-shell__sidebar" aria-label="{f:translate(key: '{ll}:module.aiLabel.folderTree.aria', default: 'Media folders')}">
    <div class="card card-size-small mb-0 w-100">
        <div class="card-body p-2">
            <div class="input-group input-group-sm mb-2">
                <input type="search" class="form-control" placeholder="{f:translate(key: '{ll}:module.aiLabel.folderTree.search', default: 'Search folders')}" data-ailabel-folder-search />
            </div>
            <nav class="aiu-ailabel-folder-tree" role="tree" aria-label="{f:translate(key: '{ll}:module.aiLabel.folderTree.aria', default: 'Media folders')}">
                <a class="node {f:if(condition: folderTree.root.active, then: 'node-selected')}"
                   href="{f:be.uri(route: 't3af_dashboard.ai_label.media', parameters: '{folder: folderTree.root.identifier}')}"
                   role="treeitem"
                   aria-selected="{f:if(condition: folderTree.root.active, then: 'true', else: 'false')}"
                   data-ailabel-folder-label="{folderTree.root.label}">
                    <div class="node-content">
                        <span class="node-icon">
                            <f:if condition="{folderTree.root.active}">
                                <f:then>
                                    <core:icon identifier="apps-filetree-folder-opened" size="small" alternativeMarkupIdentifier="inline" />
                                </f:then>
                                <f:else>
                                    <core:icon identifier="apps-filetree-folder-default" size="small" alternativeMarkupIdentifier="inline" />
                                </f:else>
                            </f:if>
                        </span>
                        <div class="node-contentlabel">
                            <div class="node-name">{folderTree.root.label}</div>
                        </div>
                    </div>
                    <span class="node-information">{folderTree.root.totalFiles}</span>
                </a>
                <f:for each="{folderTree.folders}" as="folder" iteration="folderIteration">
                    <a class="node {f:if(condition: folder.active, then: 'node-selected')}"
                       href="{f:be.uri(route: 't3af_dashboard.ai_label.media', parameters: '{folder: folder.identifier}')}"
                       role="treeitem"
                       aria-selected="{f:if(condition: folder.active, then: 'true', else: 'false')}"
                       data-ailabel-folder-label="{folder.label}">
                        <div class="node-treelines" aria-hidden="true">
                            <div class="node-treeline {f:if(condition: folderIteration.isLast, then: 'node-treeline--last', else: 'node-treeline--connect')}"></div>
                        </div>
                        <div class="node-content">
                            <span class="node-icon">
                                <f:if condition="{folder.active}">
                                    <f:then>
                                        <core:icon identifier="apps-filetree-folder-opened" size="small" alternativeMarkupIdentifier="inline" />
                                    </f:then>
                                    <f:else>
                                        <core:icon identifier="apps-filetree-folder-default" size="small" alternativeMarkupIdentifier="inline" />
                                    </f:else>
                                </f:if>
                            </span>
                            <div class="node-contentlabel">
                                <div class="node-name">{folder.label}</div>
                            </div>
                        </div>
                        <span class="node-information">{folder.totalFiles}</span>
                        <f:if condition="{folder.openCount} > 0">
                            <span class="badge badge-warning">{folder.openCount}</span>
                        </f:if>
                    </a>
                </f:for>
            </nav>
            <p class="text-variant small mb-0 mt-2 px-1"><f:translate key="{ll}:module.aiLabel.folderTree.legend" default="Amber counts are items still awaiting a person." /></p>
        </div>
    </div>
</aside>
