<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:variable name="ll" value="LLL:EXT:ns_t3af/Resources/Private/Language/locallang_mod_dashboard.xlf" />

<div class="card card-size-large aiu-ai-usage__table-card mb-3">
    <div class="card-body p-0">
        <f:render partial="AiLabel/TableToolbar" arguments="{
            variant: 'media',
            listTotalCount: mediaList.total,
            folderLabel: mediaList.folder.label,
            filters: filters,
            filterRouteParams: filterRouteParams,
            listRoute: listRoute,
            aiLabelPagination: aiLabelPagination,
            exportUri: exportUri,
            refreshUri: refreshUri
        }" />
        <div class="table-fit table-responsive aiu-ailabel-table-wrap">
            <table class="table table-striped table-hover align-middle mb-0 aiu-ailabel-table" data-ailabel-table="media">
                <thead>
                    <tr>
                        <th scope="col" class="aiu-ailabel-table__col-select">
                            <input type="checkbox" data-ailabel-select-all aria-label="{f:translate(key: '{ll}:module.aiLabel.table.selectAll', default: 'Select all')}" />
                        </th>
                        <th scope="col"><f:translate key="{ll}:module.aiLabel.table.file" default="File" /></th>
                        <th scope="col"><f:translate key="{ll}:module.aiLabel.table.kind" default="Kind" /></th>
                        <th scope="col"><f:translate key="{ll}:module.aiLabel.table.involvement" default="AI involvement" /></th>
                        <th scope="col"><f:translate key="{ll}:module.aiLabel.table.label" default="Label" /></th>
                        <th scope="col"><f:translate key="{ll}:module.aiLabel.table.why" default="Why" /></th>
                        <th scope="col"><f:translate key="{ll}:module.aiLabel.table.created" default="Created" /></th>
                        <th scope="col"><f:translate key="{ll}:module.aiLabel.table.confirmedBy" default="Confirmed by" /></th>
                        <th scope="col" class="col-control"><f:translate key="{ll}:module.aiLabel.table.actions" default="Actions" /></th>
                    </tr>
                </thead>
                <tbody>
                    <f:if condition="{mediaList.rows}">
                        <f:then>
                            <f:for each="{mediaList.rows}" as="row">
                                <tr>
                                    <td><input type="checkbox" form="aiu-ailabel-bulk-form" name="refs[]" value="sys_file_metadata:{row.uid}" data-ailabel-row-checkbox /></td>
                                    <td>
                                        <span class="text-truncate d-block aiu-ailabel-table__file" title="{row.fileName}">{row.fileName}</span>
                                    </td>
                                    <td><span class="badge badge-default">{row.kind}</span></td>
                                    <td><f:render partial="AiLabel/InvolvementBadge" arguments="{involvement: row.involvement}" /></td>
                                    <td><f:render partial="AiLabel/LabelStateBadge" arguments="{state: row.labelState}" /></td>
                                    <td><code title="{row.reasonCode}">{row.reasonCode}</code></td>
                                    <td class="text-variant"><f:format.date format="j M Y">{row.created}</f:format.date></td>
                                    <td class="text-variant">
                                        <f:if condition="{row.confirmedByLabel}">
                                            <f:then>{row.confirmedByLabel}</f:then>
                                            <f:else>-</f:else>
                                        </f:if>
                                    </td>
                                    <td>
                                        <f:render partial="AiLabel/TableActions" arguments="{
                                            ref: 'sys_file_metadata:{row.uid}',
                                            editUri: row.editUri,
                                            returnTab: 'media',
                                            bulkActionUri: bulkActionUri
                                        }" />
                                    </td>
                                </tr>
                            </f:for>
                        </f:then>
                        <f:else>
                            <tr><td colspan="9" class="text-variant"><f:translate key="{ll}:module.aiLabel.table.emptyMedia" default="No media records for current folder and filters." /></td></tr>
                        </f:else>
                    </f:if>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div class="callout callout-info">
    <strong><f:translate key="{ll}:module.aiLabel.reasonInfo.title" default="Why every row carries a reason." /></strong>
    <f:translate key="{ll}:module.aiLabel.reasonInfo.body" default="Each decision stores a machine-readable reason, so the answer is a record rather than a recollection. This is what the evidence export contains." />
</div>
</html>
