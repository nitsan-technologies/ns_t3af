<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:variable name="ll" value="LLL:EXT:ns_t3af/Resources/Private/Language/locallang_mod_dashboard.xlf" />

<div class="card mb-3">
    <div class="table-fit">
        <table class="table table-striped table-hover mb-0 aiu-ailabel-table" data-ailabel-table="media">
            <thead>
                <tr>
                    <th class="col-checkbox"><input type="checkbox" data-ailabel-select-all aria-label="{f:translate(key: '{ll}:module.aiLabel.table.selectAll', default: 'Select all')}" /></th>
                    <th><f:translate key="{ll}:module.aiLabel.table.file" default="File" /></th>
                    <th><f:translate key="{ll}:module.aiLabel.table.kind" default="Kind" /></th>
                    <th><f:translate key="{ll}:module.aiLabel.table.involvement" default="AI involvement" /></th>
                    <th><f:translate key="{ll}:module.aiLabel.table.label" default="Label" /></th>
                    <th><f:translate key="{ll}:module.aiLabel.table.why" default="Why" /></th>
                    <th><f:translate key="{ll}:module.aiLabel.table.created" default="Created" /></th>
                    <th><f:translate key="{ll}:module.aiLabel.table.confirmedBy" default="Confirmed by" /></th>
                    <th><f:translate key="{ll}:module.aiLabel.table.actions" default="Actions" /></th>
                </tr>
            </thead>
            <tbody>
                <f:if condition="{mediaList.rows}">
                    <f:then>
                        <f:for each="{mediaList.rows}" as="row">
                            <tr>
                                <td><input type="checkbox" form="aiu-ailabel-bulk-form" name="refs[]" value="sys_file_metadata:{row.uid}" data-ailabel-row-checkbox /></td>
                                <td>{row.fileName}</td>
                                <td><span class="badge badge-secondary">{row.kind}</span></td>
                                <td><f:render partial="AiLabel/InvolvementBadge" arguments="{involvement: row.involvement}" /></td>
                                <td><f:render partial="AiLabel/LabelStateBadge" arguments="{state: row.labelState}" /></td>
                                <td><code title="{row.reasonCode}">{row.reasonCode}</code></td>
                                <td class="text-variant"><f:format.date format="j M Y">{row.created}</f:format.date></td>
                                <td class="text-variant">
                                    <f:if condition="{row.confirmedByLabel}">
                                        <f:then>{row.confirmedByLabel}</f:then>
                                        <f:else>-</f:else>
                                    </f:if>
                                </td>
                                <td>
                                    <f:render partial="AiLabel/TableActions" arguments="{
                                        ref: 'sys_file_metadata:{row.uid}',
                                        editUri: row.editUri,
                                        returnTab: 'media',
                                        bulkActionUri: bulkActionUri
                                    }" />
                                </td>
                            </tr>
                        </f:for>
                    </f:then>
                    <f:else>
                        <tr><td colspan="9" class="text-variant"><f:translate key="{ll}:module.aiLabel.table.emptyMedia" default="No media records for current folder and filters." /></td></tr>
                    </f:else>
                </f:if>
            </tbody>
        </table>
    </div>
    <div class="card-footer d-flex justify-content-between text-variant small">
        <span><f:translate key="{ll}:module.aiLabel.table.range" arguments="{0: mediaList.pagination.start, 1: mediaList.pagination.end, 2: mediaList.total, 3: mediaList.folder.label}" default="Records %1$s–%2$s of %3$s in %4$s" /></span>
        <span><f:translate key="{ll}:module.aiLabel.table.page" arguments="{0: mediaList.pagination.page, 1: mediaList.pagination.totalPages}" default="Page %1$s / %2$s" /></span>
    </div>
</div>

<div class="callout callout-info">
    <strong><f:translate key="{ll}:module.aiLabel.reasonInfo.title" default="Why every row carries a reason." /></strong>
    <f:translate key="{ll}:module.aiLabel.reasonInfo.body" default="Each decision stores a machine-readable reason, so the answer is a record rather than a recollection. This is what the evidence export contains." />
</div>
