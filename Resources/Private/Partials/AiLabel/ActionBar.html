<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:variable name="ll" value="LLL:EXT:ns_t3af/Resources/Private/Language/locallang_mod_dashboard.xlf" />

<div class="card mb-3 aiu-ailabel-action-bar">
    <div class="card-body py-2 d-flex flex-wrap align-items-center justify-content-between gap-2">
        <div class="d-flex flex-wrap align-items-center gap-2">
            <span class="text-variant small" data-ailabel-selected-count>0 <f:translate key="{ll}:module.aiLabel.action.selected" default="selected" /></span>
            <button type="submit" form="aiu-ailabel-bulk-form" name="action" value="confirm" class="btn btn-success btn-sm d-none" data-ailabel-bulk-btn><f:translate key="{ll}:module.aiLabel.action.confirm" default="Confirm" /></button>
            <button type="submit" form="aiu-ailabel-bulk-form" name="action" value="no_ai" class="btn btn-default btn-sm d-none" data-ailabel-bulk-btn><f:translate key="{ll}:module.aiLabel.action.noAi" default="No AI involved" /></button>
            <button type="submit" form="aiu-ailabel-bulk-form" name="action" value="do_not_label" class="btn btn-default btn-sm d-none" data-ailabel-bulk-btn><f:translate key="{ll}:module.aiLabel.action.doNotLabel" default="Do not label…" /></button>
            <f:if condition="{variant} == text">
                <f:then>
                    <button type="submit" form="aiu-ailabel-bulk-form" name="action" value="set_public_interest" class="btn btn-default btn-sm d-none" data-ailabel-bulk-btn><f:translate key="{ll}:module.aiLabel.action.setPublicInterest" default="Set public interest" /></button>
                </f:then>
            </f:if>
            <button type="submit" form="aiu-ailabel-bulk-form" name="action" value="clear" class="btn btn-outline-danger btn-sm d-none" data-ailabel-bulk-btn><f:translate key="{ll}:module.aiLabel.action.clear" default="Clear confirmation" /></button>
            <form method="post" action="{undoUri}" class="d-inline">
                <input type="hidden" name="returnTab" value="{returnTab}" />
                <button type="submit" class="btn btn-default btn-sm" data-ailabel-undo><f:translate key="{ll}:module.aiLabel.action.undo" default="Undo last bulk action" /></button>
            </form>
        </div>
    </div>
</div>

<form method="post" action="{bulkActionUri}" id="aiu-ailabel-bulk-form">
    <input type="hidden" name="returnTab" value="{returnTab}" />
    <input type="hidden" name="payload" value="" data-ailabel-bulk-payload />
</form>
