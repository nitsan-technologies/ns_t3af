<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      data-namespace-typo3-fluid="true">
<f:variable name="ll" value="LLL:EXT:ns_t3af/Resources/Private/Language/locallang_mod_dashboard.xlf" />
<f:variable name="resolvedLabel"><f:translate key="{ll}:{labelKey}" default="{labelDefault}" /></f:variable>
<f:variable name="resolvedHelp"><f:translate key="{ll}:{helpKey}" default="{helpDefault}" /></f:variable>
<f:variable name="resolvedAria"><f:translate key="{ll}:provider.field.help.aria" default="Show help for this field" /></f:variable>

<span data-aiu-field-label-text>{resolvedLabel}</span>
<f:render partial="Module/FieldHelpIcon" arguments="{
    helpTitle: resolvedLabel,
    helpText: resolvedHelp,
    ariaLabel: resolvedAria
}" />
</html>
